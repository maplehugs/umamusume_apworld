<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UmaPS Admin</title>
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="custom-support.css">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.png">
  <script type="module" src="desktop.js"></script>
</head>
<body>
  <nav id="dock">
    <div class="logo" title="UmaPS Admin" aria-label="UmaPS Admin"></div>
    <div id="dock-apps"></div>
    <div class="spacer"></div>
    <a class="dock-btn" href="https://uma.5maple.com" target="_blank" rel="noopener" aria-label="Website">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span class="tip">Website: guides, YAML builder, bug reports</span></a>
    <div id="dock-region"></div>
    <div id="dock-language"></div>
    <div id="dock-target"></div>
    <div id="conn" class="conn"></div>
  </nav>
  <main id="desktop">
    <div id="wallpaper-hint"><div><b>UmaPS Admin</b>Pick something from the sidebar · <kbd>Alt</kbd>+<kbd>1</kbd>–<kbd>9</kbd></div></div>
  </main>
  <div id="toasts"></div>
