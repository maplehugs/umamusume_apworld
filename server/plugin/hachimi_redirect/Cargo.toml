[package]
name = "hachimi_redirect"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Hachimi-Edge plugin: send Global/JP game API traffic to a custom server, optionally hiding device/Steam identifiers -- no hosts redirect, no installed certificate"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"

# serde_json validates optional custom-card manifests; Win32 calls are declared by hand.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
